services:
  - type: web
    name: ai-meeting-copilot-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: CORS_ORIGIN_REGEX
        value: "^https://.*\\.vercel\\.app$"
      - key: WHISPER_MODEL
        value: tiny
      - key: WHISPER_ENABLED
        value: "true"
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      # Optional: To use high-speed cloud LLM inference on Render without needing Ollama,
      # add GROQ_API_KEY in the Render dashboard (free at https://console.groq.com)
      # - key: GROQ_API_KEY
      #   sync: false
